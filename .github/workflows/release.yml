name: Release Foundry Talk

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/foundry-talk
          cp -R scripts styles templates dist/foundry-talk/

          node - <<'NODE'
          const fs = require("fs");
          const moduleJson = JSON.parse(fs.readFileSync("module.json", "utf8"));
          const repository = process.env.GITHUB_REPOSITORY;
          const releaseBase = `https://github.com/${repository}/releases/latest/download`;

          moduleJson.url = `https://github.com/${repository}`;
          moduleJson.manifest = `${releaseBase}/module.json`;
          moduleJson.download = `${releaseBase}/foundry-talk.zip`;

          fs.writeFileSync("dist/module.json", `${JSON.stringify(moduleJson, null, 2)}\n`);
          fs.writeFileSync("dist/foundry-talk/module.json", `${JSON.stringify(moduleJson, null, 2)}\n`);
          NODE

          cd dist
          zip -r foundry-talk.zip foundry-talk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/module.json
            dist/foundry-talk.zip